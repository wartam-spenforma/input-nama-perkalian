<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h1 {
            color: #333;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .form-header p {
            color: #888;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group label .required {
            color: #e74c3c;
            margin-left: 3px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .form-group input.error {
            border-color: #e74c3c;
            background-color: #fff5f5;
        }

        .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 0.5px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-submit.loading {
            position: relative;
            color: transparent;
        }

        .btn-submit.loading::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            border: 3px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes spin {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .status-message {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 600;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .status-message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .status-message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .status-message.info {
            display: block;
            background: #d1ecf1;
            color: #0c5460;
            border: 2px solid #bee5eb;
        }

        .reset-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .reset-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .form-footer {
            margin-top: 20px;
            text-align: center;
            color: #aaa;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 25px;
            }

            .form-header h1 {
                font-size: 22px;
            }

            .form-group input {
                padding: 10px 14px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h1>📋 Form Pendaftaran</h1>
            <p>Silakan isi data diri Anda di bawah ini</p>
        </div>

        <form id="registrationForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="nama">
                    Nama Lengkap <span class="required">*</span>
                </label>
                <input 
                    type="text" 
                    id="nama" 
                    name="nama" 
                    placeholder="Masukkan nama lengkap Anda"
                    required
                    autocomplete="name"
                >
                <div class="error-message" id="namaError">Nama tidak boleh kosong</div>
            </div>

            <div class="form-group">
                <label for="sekolah">
                    Asal Sekolah <span class="required">*</span>
                </label>
                <input 
                    type="text" 
                    id="sekolah" 
                    name="sekolah" 
                    placeholder="Masukkan nama sekolah Anda"
                    required
                    autocomplete="organization"
                >
                <div class="error-message" id="sekolahError">Sekolah tidak boleh kosong</div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Kirim Data</button>

            <div class="status-message" id="statusMessage"></div>
            
            <a class="reset-link" onclick="resetForm()">↻ Isi ulang form</a>
        </form>

        <div class="form-footer">
            Data akan disimpan ke Google Sheets
        </div>
    </div>

    <script>
        // Konfigurasi Google Sheets
        // Spreadsheet ID: 1Q5garJNM9b6kP-jehoMCBQFGd8_lLvqXwrPgAVQzVUg
        // Sheet name: nama
        // Kolom A: Nama, Kolom B: Sekolah
        
        // URL Web App (Ganti dengan URL deploy Web App Anda)
        // Untuk menggunakan script ini, Anda perlu membuat Web App di Google Apps Script
        // dan mengganti URL di bawah ini dengan URL Web App Anda
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzwWxf-oM2lF-4qmA_xVeyVAAL02hDHeAyUtILwM2P7FkXMjTGDTf5IOo60hjfZX7kYyg/exec"; // Ganti dengan URL Anda

        // Jika belum memiliki Web App, gunakan mode simulasi untuk testing
        const USE_SIMULATION = true; // Set ke false jika sudah memiliki Web App

        function handleSubmit(event) {
            event.preventDefault();
            
            // Reset status
            clearErrors();
            hideStatus();

            // Ambil nilai input
            const namaInput = document.getElementById('nama');
            const sekolahInput = document.getElementById('sekolah');
            const nama = namaInput.value.trim();
            const sekolah = sekolahInput.value.trim();

            // Validasi
            let isValid = true;

            if (!nama) {
                showError('namaError');
                namaInput.classList.add('error');
                isValid = false;
            } else {
                namaInput.classList.remove('error');
            }

            if (!sekolah) {
                showError('sekolahError');
                sekolahInput.classList.add('error');
                isValid = false;
            } else {
                sekolahInput.classList.remove('error');
            }

            if (!isValid) {
                showStatus('Mohon lengkapi semua data yang diperlukan', 'error');
                return;
            }

            // Kirim data
            submitData(nama, sekolah);
        }

        function submitData(nama, sekolah) {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');

            const data = {
                nama: nama,
                sekolah: sekolah
            };

            if (USE_SIMULATION) {
                // Mode simulasi untuk testing tanpa Web App
                console.log('📤 Data yang dikirim (simulasi):', data);
                
                // Simulasi delay jaringan
                setTimeout(() => {
                    // Simulasikan sukses
                    showStatus('✅ Data berhasil dikirim! (Mode Simulasi)', 'success');
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('loading');
                    
                    // Reset form setelah sukses
                    document.getElementById('registrationForm').reset();
                    
                    // Log data untuk debugging
                    console.log('📊 Data yang akan disimpan ke Google Sheet:');
                    console.log(`  - Nama: ${data.nama}`);
                    console.log(`  - Sekolah: ${data.sekolah}`);
                    console.log(`  - Spreadsheet ID: 1Q5garJNM9b6kP-jehoMCBQFGd8_lLvqXwrPgAVQzVUg`);
                    console.log(`  - Sheet: nama`);
                    console.log(`  - Kolom A: Nama, Kolom B: Sekolah`);
                }, 1500);
                return;
            }

            // Kirim data ke Google Apps Script Web App
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Mode no-cors untuk menghindari CORS
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                // Karena mode no-cors, response tidak bisa dibaca
                // Tapi data tetap terkirim
                showStatus('✅ Data berhasil dikirim!', 'success');
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
                document.getElementById('registrationForm').reset();
                
                console.log('✅ Data terkirim ke Google Sheets');
                console.log(`  - Nama: ${data.nama}`);
                console.log(`  - Sekolah: ${data.sekolah}`);
            })
            .catch(error => {
                console.error('❌ Error:', error);
                showStatus('❌ Gagal mengirim data. Silakan coba lagi.', 'error');
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
            });
        }

        // --- Fungsi UI ---
        function showError(id) {
            document.getElementById(id).classList.add('show');
        }

        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
            });
            document.querySelectorAll('.form-group input').forEach(el => {
                el.classList.remove('error');
            });
        }

        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = 'status-message ' + type;
        }

        function hideStatus() {
            const statusEl = document.getElementById('statusMessage');
            statusEl.className = 'status-message';
            statusEl.textContent = '';
        }

        function resetForm() {
            document.getElementById('registrationForm').reset();
            clearErrors();
            hideStatus();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = false;
            submitBtn.classList.remove('loading');
            
            // Fokus ke input pertama
            document.getElementById('nama').focus();
        }

        // Tambahkan event listener untuk real-time validation
        document.addEventListener('DOMContentLoaded', function() {
            const namaInput = document.getElementById('nama');
            const sekolahInput = document.getElementById('sekolah');

            namaInput.addEventListener('input', function() {
                if (this.value.trim()) {
                    this.classList.remove('error');
                    document.getElementById('namaError').classList.remove('show');
                }
            });

            sekolahInput.addEventListener('input', function() {
                if (this.value.trim()) {
                    this.classList.remove('error');
                    document.getElementById('sekolahError').classList.remove('show');
                }
            });

            // Fokus ke input pertama
            namaInput.focus();
        });
    </script>
</body>
</html>
